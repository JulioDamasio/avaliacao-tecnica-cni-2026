<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Compra</title>
</head>
<body>
    
    <h1>Formulário de Compra</h1>

        <form id="formularioCompra">
            
            <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required><br><br>

            <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

            <label for="produto">Produto:</label>
                <select id="produto" name="produto" required>
                    <option value="">Selecione um produto</option>
                    <option value="Calça">Calça</option>
                    <option value="Camisa">Camisa</option>
                    <option value="Blusa">Blusa</option>
                </select><br><br>   

            <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" placeholder="Selecione a Quantidade" min="1" required><br><br>

            <label for="prioridade">Prioridade:</label>
                <select id="prioridade" name="prioridade" required>
                    <option value="">Selecione a Prioridade</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select><br><br>

            <input type="submit" value="Comprar">
        </form>
        
    <div id="resumo"></div> 

    <script src="Scripts.js"></script> 

</body>
</html>
